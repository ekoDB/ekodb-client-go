name: release

# A chore(*): vX.Y.Z cap merged to main cuts the tag, publishes the Release
# from the CHANGELOG block, and runs the pkg.go.dev index step. version.json
# is the module's manifest, edited in the cap commit like the changelog; the
# cap subject is cross-checked against it.
#
# Rebase-merge release caps to main: this is the repository convention and
# supported release path. A squash subject with an appended PR number is not
# a cap. The shared workflow also recognizes a cap at the second parent of a
# two-parent merge, so that form can publish.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  auto-tag:
    uses: ekoDB/ekodb-workflows-public/.github/workflows/auto-tag.yml@main
    with:
      version-command: jq -r .version version.json
      post-tag-command: make index-release VERSION="$TAG"
